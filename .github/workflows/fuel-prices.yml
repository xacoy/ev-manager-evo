name: Actualizar precio gasolina Canarias

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      desde:
        description: "Rellenar días sin dato desde (AAAA-MM-DD, opcional)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar precios y calcular la media
        env:
          BACKFILL_FROM: ${{ github.event.inputs.desde }}
        run: python3 scripts/update_fuel.py
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fuel-canarias.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "chore: actualizar precio medio gasolina 95 Canarias"
            git pull --rebase origin master   # por si alguien ha subido cambios mientras tanto
            git push
          fi
