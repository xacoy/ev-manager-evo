# Config nginx reforzada para servir EV Manager Evo (app estática, sin backend).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    autoindex off;
    server_tokens off;

    # --- Cabeceras de seguridad ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;

    # CSP ajustada a lo que la app realmente carga:
    #  - Chart.js desde cdn.jsdelivr.net
    #  - Fuente Space Grotesk desde Google Fonts
    #  - 'unsafe-inline' en script/style porque index.html es un único
    #    archivo con <script>/estilos inline (arquitectura self-contained
    #    a propósito). Si en el futuro se separa el JS a un archivo externo,
    #    se puede quitar 'unsafe-inline' de script-src.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'" always;

    # Nota: usamos "expires" (no "add_header Cache-Control") para el cacheo.
    # Un location que define su propio add_header deja de heredar los
    # add_header del bloque server padre — con "expires" evitamos perder
    # las cabeceras de seguridad de arriba en estas rutas.
    location = /manifest.json {
        default_type application/manifest+json;
        expires 1h;
    }

    location ~* \.json$ {
        expires 1h;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Bloquea archivos ocultos (.git, .env, etc.) por si acaban en el volumen.
    location ~ /\. {
        deny all;
    }
}
