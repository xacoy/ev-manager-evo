# EV Manager Evo — despliegue estático reforzado (nginx sin privilegios)
# Pensado para NAS + Docker + Cloudflare Tunnel (cloudflared).
#
# USO:
#   1. Copia index.html, manifest.json y la carpeta data/ dentro de ./site
#      (o clona el repo entero: git clone https://github.com/xacoy/ev-manager-evo.git site)
#   2. Elige UNA de las dos formas de conectar con tu Tunnel — ver README.md en esta carpeta.
#   3. docker compose up -d
#
# Endurecido: sin privilegios (nginx-unprivileged), solo lectura, sin capabilities
# de Linux, sin escalado de privilegios, límites de memoria/procesos.

services:
  ev-manager-evo:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    container_name: ev-manager-evo
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    mem_limit: 64m
    pids_limit: 50

    # --- Opción A (recomendada): cloudflared es OTRO contenedor Docker ---
    # No publiques ningún puerto: conecta este contenedor a la MISMA red
    # Docker que usa tu contenedor cloudflared. Cero puertos expuestos.
    networks:
      - cloudflared_net

    # --- Opción B: cloudflared corre nativo en UGOS (no en Docker) ---
    # Comenta el bloque "networks:" de arriba y descomenta esto. En el
    # dashboard de Cloudflare Zero Trust, apunta el Tunnel a
    # http://<IP-LAN-del-NAS>:8091 (NO a una IP pública).
    # ports:
    #   - "127.0.0.1:8091:8080"

networks:
  cloudflared_net:
    external: true
    # Sustituye por el nombre real de la red de tu stack de cloudflared.
    # Para verlo: docker network ls
    name: CAMBIA_ESTO_nombre_de_red_de_cloudflared
