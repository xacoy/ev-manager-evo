# EV Manager Evo — servidor con backend (Node + SQLite integrado, sin
# dependencias npm de terceros) para tener los datos sincronizados entre
# dispositivos (móvil, coche...). Pensado para NAS + Docker + Cloudflare
# Tunnel (cloudflared).
#
# USO:
#   1. Copia index.html, manifest.json y la carpeta data/ dentro de ./site
#      (o clona el repo entero: git clone https://github.com/xacoy/ev-manager-evo.git site)
#   2. Elige UNA de las dos formas de conectar con tu Tunnel — ver README.md en esta carpeta.
#   3. docker compose up -d --build
#
# Endurecido: usuario sin privilegios, solo lectura salvo el volumen de
# datos, sin capabilities de Linux, sin escalado de privilegios, límites
# de memoria/procesos, cero dependencias npm (superficie de ataque mínima).

services:
  ev-manager-evo:
    build: ./server
    container_name: ev-manager-evo
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    volumes:
      - ./site:/app/site:ro
      - ev-data:/data
    mem_limit: 128m
    pids_limit: 50

    # --- Opción A (recomendada): cloudflared es OTRO contenedor Docker ---
    # No publiques ningún puerto: conecta este contenedor a la MISMA red
    # Docker que usa tu contenedor cloudflared. Cero puertos expuestos.
    networks:
      - cloudflared_net

    # --- Opción B: cloudflared corre nativo en UGOS (no en Docker) ---
    # Comenta el bloque "networks:" de arriba y descomenta esto. En el
    # dashboard de Cloudflare Zero Trust, apunta el Tunnel a
    # http://<IP-LAN-del-NAS>:8091 (NO a una IP pública).
    # ports:
    #   - "127.0.0.1:8091:8080"

volumes:
  ev-data:
    # Aquí vive app.db (SQLite) con TODOS tus datos: cargas, mantenimiento,
    # notas, adjuntos. Haz backup de este volumen (o usa "Exportar" en la
    # app de vez en cuando) — es lo único que de verdad importa conservar.

networks:
  cloudflared_net:
    external: true
    # Sustituye por el nombre real de la red de tu stack de cloudflared.
    # Para verlo: docker network ls
    name: CAMBIA_ESTO_nombre_de_red_de_cloudflared
