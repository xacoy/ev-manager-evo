<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ABIGAIL 1984</title>
<style>
  :root {
    --pink: #ff2e97;
    --cyan: #00f0ff;
    --yellow: #ffe600;
    --purple: #2a0a4a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #0a0014;
    color: var(--cyan);
    font-family: "Courier New", Courier, monospace;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px 16px 40px;
    position: relative;
  }

  /* Sol retro */
  .sun {
    position: fixed;
    left: 50%;
    bottom: 32vh;
    width: min(70vw, 420px);
    aspect-ratio: 1;
    transform: translateX(-50%);
    border-radius: 50%;
    background: linear-gradient(to bottom, var(--yellow) 0%, #ff8a00 40%, var(--pink) 75%, #8a00c2 100%);
    box-shadow: 0 0 80px rgba(255, 46, 151, .6);
    -webkit-mask-image: repeating-linear-gradient(to bottom, #000 0 14px, transparent 14px 18px);
            mask-image: repeating-linear-gradient(to bottom, #000 0 14px, transparent 14px 18px);
    -webkit-mask-size: 100% 100%;
    z-index: 0;
  }
  .sun::after {
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(to bottom, transparent 55%, #0a0014 56%);
    border-radius: 50%;
  }

  /* Suelo de rejilla */
  .grid {
    position: fixed;
    left: -50%; right: -50%;
    bottom: 0;
    height: 34vh;
    background:
      linear-gradient(to bottom, #0a0014 0%, transparent 40%),
      repeating-linear-gradient(to right, var(--pink) 0 2px, transparent 2px 60px),
      repeating-linear-gradient(to bottom, var(--pink) 0 2px, transparent 2px 40px);
    transform: perspective(300px) rotateX(60deg);
    transform-origin: bottom;
    animation: scroll 1.2s linear infinite;
    z-index: 0;
    opacity: .75;
  }
  @keyframes scroll {
    from { background-position: 0 0, 0 0, 0 0; }
    to   { background-position: 0 0, 0 0, 0 40px; }
  }

  /* Líneas de monitor CRT */
  body::after {
    content: "";
    position: fixed; inset: 0;
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,.28) 0 1px, transparent 1px 3px);
    pointer-events: none;
    z-index: 10;
  }

  main {
    position: relative;
    z-index: 2;
    width: min(92vw, 640px);
    text-align: center;
  }

  h1 {
    font-family: Impact, "Arial Black", sans-serif;
    font-style: italic;
    font-size: clamp(2rem, 9vw, 4.2rem);
    letter-spacing: .08em;
    text-transform: uppercase;
    color: #fff;
    text-shadow:
      3px 3px 0 var(--pink),
      6px 6px 0 var(--purple),
      0 0 24px var(--cyan);
    margin-bottom: 6px;
  }
  .sub {
    color: var(--yellow);
    letter-spacing: .35em;
    font-size: .8rem;
    text-transform: uppercase;
    margin-bottom: 28px;
    text-shadow: 0 0 8px var(--yellow);
  }

  /* Botón principal */
  #btn {
    font-family: Impact, "Arial Black", sans-serif;
    font-size: clamp(1.8rem, 8vw, 3rem);
    letter-spacing: .12em;
    text-transform: uppercase;
    padding: 18px 56px;
    color: #fff;
    cursor: pointer;
    border: 4px solid #fff;
    border-radius: 6px;
    background: linear-gradient(to bottom, #ff6ac1 0%, var(--pink) 48%, #b0005f 50%, #ff2e97 100%);
    box-shadow: 0 8px 0 #6b0039, 0 0 30px var(--pink), inset 0 0 12px rgba(255,255,255,.5);
    text-shadow: 2px 2px 0 #6b0039;
    transition: transform .08s, box-shadow .08s;
  }
  #btn:hover { filter: brightness(1.15); }
  #btn:active {
    transform: translateY(6px);
    box-shadow: 0 2px 0 #6b0039, 0 0 40px var(--pink), inset 0 0 12px rgba(255,255,255,.5);
  }
  #btn:focus-visible { outline: 3px dashed var(--yellow); outline-offset: 6px; }

  /* Botones de categoría */
  .cats {
    margin-top: 30px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
  }
  .cat {
    font-family: Impact, "Arial Black", sans-serif;
    font-size: 1.05rem;
    letter-spacing: .08em;
    text-transform: uppercase;
    padding: 10px 18px;
    color: #fff;
    cursor: pointer;
    border: 3px solid #fff;
    border-radius: 4px;
    text-shadow: 2px 2px 0 rgba(0,0,0,.6);
    transition: transform .08s, box-shadow .08s;
  }
  .cat:hover { filter: brightness(1.15); }
  .cat:active { transform: translateY(4px); }
  .cat:focus-visible { outline: 3px dashed var(--yellow); outline-offset: 4px; }
  .c-hot   { background: linear-gradient(#ff8a3d, #e01e00 50%, #a10f00 52%, #e01e00); box-shadow: 0 5px 0 #5c0900, 0 0 18px #ff4a1c; }
  .c-brain { background: linear-gradient(#7fe9ff, #0090c8 50%, #00608c 52%, #0090c8); box-shadow: 0 5px 0 #002f47, 0 0 18px var(--cyan); }
  .c-sweet { background: linear-gradient(#c9a0ff, #8a3fe0 50%, #5d22a8 52%, #8a3fe0); box-shadow: 0 5px 0 #2d0f58, 0 0 18px #b36bff; }
  .c-hot:active   { box-shadow: 0 1px 0 #5c0900, 0 0 18px #ff4a1c; }
  .c-brain:active { box-shadow: 0 1px 0 #002f47, 0 0 18px var(--cyan); }
  .c-sweet:active { box-shadow: 0 1px 0 #2d0f58, 0 0 18px #b36bff; }

  /* Pantalla de resultado */
  .screen {
    margin: 36px auto 0;
    padding: 20px 18px;
    min-height: 130px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0, 20, 10, .85);
    border: 3px solid var(--cyan);
    border-radius: 10px;
    box-shadow: 0 0 22px var(--cyan), inset 0 0 22px rgba(0,240,255,.25);
    color: #39ff14;
    font-size: clamp(1.05rem, 4.2vw, 1.5rem);
    line-height: 1.5;
    text-shadow: 0 0 8px #39ff14;
  }
  .screen.empty { color: var(--cyan); text-shadow: 0 0 8px var(--cyan); }
  .cursor::after {
    content: "█";
    margin-left: 4px;
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* Zona de correo */
  .mail {
    margin-top: 22px;
    display: none;
    gap: 10px;
    flex-direction: column;
    align-items: center;
  }
  .mail.show { display: flex; }
  .mail input {
    width: min(100%, 380px);
    padding: 10px 12px;
    font-family: inherit;
    font-size: 1rem;
    color: var(--yellow);
    background: #000;
    border: 2px solid var(--yellow);
    box-shadow: 0 0 10px rgba(255,230,0,.5);
  }
  .mail input::placeholder { color: rgba(255,230,0,.5); }
  .mail a {
    display: inline-block;
    padding: 12px 26px;
    font-family: Impact, "Arial Black", sans-serif;
    letter-spacing: .1em;
    text-transform: uppercase;
    text-decoration: none;
    color: #000;
    background: linear-gradient(to bottom, #fff58a, var(--yellow) 50%, #d8a800 52%, var(--yellow));
    border: 3px solid #fff;
    border-radius: 4px;
    box-shadow: 0 5px 0 #7a5f00, 0 0 20px var(--yellow);
  }
  .mail a:active { transform: translateY(4px); box-shadow: 0 1px 0 #7a5f00, 0 0 20px var(--yellow); }
  .mail a:focus-visible { outline: 3px dashed var(--cyan); outline-offset: 4px; }

  footer {
    margin-top: 30px;
    font-size: .7rem;
    letter-spacing: .25em;
    color: rgba(0,240,255,.7);
  }

  @media (prefers-reduced-motion: reduce) {
    .grid, .cursor::after { animation: none; }
  }
</style>
</head>
<body>
  <div class="sun" aria-hidden="true"></div>
  <div class="grid" aria-hidden="true"></div>

  <main>
    <h1>Insultómatic</h1>
    <p class="sub">★ Modelo 1984 ★</p>

    <button id="btn" type="button">Abigail</button>

    <div class="cats">

    <div id="mail" class="mail">

  const categorias = {

    listas: [

  const ultimos = {};

  function actualizarCorreo(texto) {

      "?subject=" + encodeURIComponent(asunto) +
      "&body=" + encodeURIComponent(cuerpo);
  }

  function escribir(texto) {
    clearInterval(timer);
    screen.classList.remove("empty");
    screen.classList.add("cursor");
    screen.textContent = "";
    let i = 0;
    timer = setInterval(() => {
      screen.textContent = texto.slice(0, ++i);
      if (i >= texto.length) {
        clearInterval(timer);
        screen.classList.remove("cursor");
      }
    }, 22);
  }

  function pedir(cat) {
    const lista = cat === "todos"
      ? insultos.concat(categorias.picantes, categorias.listas, categorias.dulces)
      : categorias[cat];
    let n;
    do { n = Math.floor(Math.random() * lista.length); } while (n === ultimos[cat] && lista.length > 1);
    ultimos[cat] = n;
    actual = lista[n];
    escribir(actual);
    actualizarCorreo(actual);
    mail.classList.add("show");
  }

  btn.addEventListener("click", () => pedir("todos"));
  document.querySelectorAll(".cat").forEach(b =>
    b.addEventListener("click", () => pedir(b.dataset.cat)));

  to.addEventListener("input", () => {
    if (actual) actualizarCorreo(actual);
  });

</html>
